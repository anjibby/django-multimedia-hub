<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia Gallery</title>
</head>
<body>
    <h1>Multimedia Gallery</h1>
    <ul>
        {% for item in media_items %}
            <li>{{ item.title }}</li>
        {% empty %}
            <li>No media available.</li>
        {% endfor %}
    </ul>
</body>
</html>
